[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melodex-provider-sdk"
version = "0.3.0"
description = "Reference SDK and protocol files for the source-neutral Melodex Provider Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Melodex contributors"}]
keywords = ["music", "media", "provider", "plugin", "openapi", "melodex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
web = [
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "build>=1.2,<2",
]

[project.scripts]
melodex-provider = "melodex_provider_sdk.cli:main"
melodex-extension = "melodex_provider_sdk.extension_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
melodex_provider_sdk = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
