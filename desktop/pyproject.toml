[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "melodex-desktop"
version = "0.1.0"
description = "Melodex — source-neutral music player with Flow and optional LLM control"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "numpy>=2.0", "mutagen>=1.47", "requests>=2.31"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
melodex = "melodex.app:main"
melodex-mcp = "melodex.mcp_server:main"

[tool.setuptools]
packages = ["melodex", "melodex.providers"]
