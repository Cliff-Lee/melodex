name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Melodex. Please do not include passwords, API keys, Provider Bridge tokens, or copyrighted media.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows
        - Android
        - Linux / source build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Melodex version
      placeholder: "e.g. v0.2.0 packaged release, or main @ <commit SHA>"
    validations:
      required: true
  - type: dropdown
    id: build_origin
    attributes:
      label: How did you install/run Melodex?
      options:
        - Packaged GitHub release
        - Built/run from current main
        - Built/run from another branch/commit
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Relevant source / extension
      options:
        - Local Files
        - User Streams
        - Jamendo
        - Plugin Directory provider
        - Manual third-party provider
        - Capability extension (.mdxplugin)
        - Provider Bridge / Android
        - LLM / MCP / OpenAI tools
        - Not source-related
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. Play…
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens and personal paths before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I have removed passwords, API keys, Bridge tokens and other secrets.
          required: true
