name: Beta Test Report
description: Tell us how Melodex behaved with your real library, machine and listening workflow
title: "[Beta test]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stress-testing Melodex. You do not need to be technical, and small observations are useful.

        We are especially interested in huge libraries, NAS/network collections, Windows/Linux setups, and messy metadata.

        Please do not post passwords, API keys, tokens, private URLs or copyrighted music files.

  - type: checkboxes
    id: tester_profile
    attributes:
      label: What kind of test is this?
      description: Check any that apply.
      options:
        - label: "🐘 Huge library (50,000+ tracks)"
        - label: "🌐 NAS / network-mounted collection"
        - label: "🪟 Windows"
        - label: "🐧 Linux"
        - label: "🧪 Messy / incomplete / unusual metadata"
        - label: "🍎 macOS"
        - label: "🎧 Normal/smaller everyday library"

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows
        - Linux
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "e.g. macOS 26.0, Windows 11 24H2, Ubuntu 26.04"

  - type: input
    id: version
    attributes:
      label: Melodex version
      placeholder: "e.g. v0.7.8"
    validations:
      required: true

  - type: dropdown
    id: library_size
    attributes:
      label: Approximate local library size
      options:
        - No local library
        - Under 500 tracks
        - 500–5,000 tracks
        - 5,000–25,000 tracks
        - 25,000–50,000 tracks
        - 50,000–100,000 tracks
        - 100,000–500,000 tracks
        - 500,000–1,000,000 tracks
        - More than 1,000,000 tracks
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Where is the music stored?
      options:
        - Internal/local drive
        - External USB / Thunderbolt drive
        - NAS / SMB share
        - NFS / other network mount
        - Mixed local and network storage
        - No local library
        - Other / not sure
    validations:
      required: true

  - type: input
    id: formats
    attributes:
      label: Main audio formats
      placeholder: "e.g. FLAC, MP3, M4A, WAV, mixed"

  - type: textarea
    id: tried
    attributes:
      label: What did you try?
      description: A short list is enough.
      placeholder: "Imported 73k FLACs from a NAS, searched while scanning, played an album, switched to Artists…"
    validations:
      required: true

  - type: textarea
    id: performance
    attributes:
      label: How did it behave?
      description: Mention freezes, beach balls, long pauses, unexpectedly high memory/CPU use, slow screens, or anything that felt impressively fast.
      placeholder: "The UI stayed responsive during discovery; Artists opened immediately; memory reached about …"

  - type: textarea
    id: good
    attributes:
      label: What worked well?
      description: What felt clear, useful, reliable or fast?

  - type: textarea
    id: confusing
    attributes:
      label: What was confusing, awkward or broken?
      description: Tell us where you hesitated, got lost, saw bad metadata, or expected something different.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: If something failed, how can we reproduce it?
      description: Exact steps are ideal, but approximate steps are still useful.

  - type: dropdown
    id: return
    attributes:
      label: Would you use Melodex again in its current state?
      options:
        - Yes
        - Probably
        - Maybe
        - Probably not
        - No
    validations:
      required: true

  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: Screenshots and redacted diagnostics are welcome when they help explain the result.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed passwords, API keys, tokens and other private information.
          required: true
