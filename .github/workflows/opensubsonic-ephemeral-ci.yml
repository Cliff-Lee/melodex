name: OpenSubsonic disposable real-server qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/opensubsonic-ephemeral-ci.yml
      - desktop/bundled_provider_sources/opensubsonic_personal/**
      - desktop/tools/qualify_opensubsonic_live.py
      - desktop/melodex/playback_gateway.py
permissions:
  contents: read
jobs:
  disposable-navidrome:
    name: Real Navidrome authenticated search and HTTP Range (no audio output)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and audio fixture dependencies
        run: |
          python -m pip install numpy mutagen requests PySide6 "segno>=1.6,<2" keyring
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run private disposable Navidrome and Melodex provider probe
        shell: bash
        env:
          MELODEX_SUBSONIC_ALLOW_HTTP: '1'
          MELODEX_SUBSONIC_URL: http://127.0.0.1:4533
          MELODEX_SUBSONIC_USERNAME: admin
          MELODEX_SUBSONIC_QUERY: R1SyntheticSignal
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/r1-opensubsonic-fixture"
          mkdir -p "$fixture_root/music" "$fixture_root/data"
          ffmpeg -hide_banner -loglevel error -f lavfi -i \
            sine=frequency=440:duration=8 -ar 44100 -ac 2 \
            -metadata artist=MelodexCI \
            -metadata album=DisposableFixture \
            -metadata title=R1SyntheticSignal \
            -codec:a libmp3lame -q:a 4 -y \
            "$fixture_root/music/R1SyntheticSignal.mp3"

          # Short-lived randomly generated credential, never printed.
          ND_DEVAUTOCREATEADMINPASSWORD="$(python -c 'import secrets; print(secrets.token_hex(14))')"
          export ND_DEVAUTOCREATEADMINPASSWORD
          export MELODEX_SUBSONIC_PASSWORD="$ND_DEVAUTOCREATEADMINPASSWORD"
          service_name="melodex-r1-nav-$$"
          cleanup() { docker rm -f "$service_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm -d --name "$service_name" \
            --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:4533:4533 \
            -v "$fixture_root/data:/data" \
            -v "$fixture_root/music:/music:ro" \
            -e ND_DEVAUTOCREATEADMINPASSWORD \
            -e ND_LOGLEVEL=warn \
            -e ND_SCANSCHEDULE="@every 1m" \
            navidrome/navidrome:0.64.2 >/dev/null

          # Wait for admin creation and index of the artificial track.
          # Printed probe output contains booleans, not song data or tokens.
          success=0
          for attempt in $(seq 1 50); do
            if PYTHONPATH=desktop python desktop/tools/qualify_opensubsonic_live.py \
              > "$RUNNER_TEMP/navidrome-transport-check.json"; then
              success=1
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/navidrome-transport-check.json"
          if [[ "$success" != 1 ]]; then
            echo "Real Navidrome transport qualification failed; no secrets logged"
            exit 1
          fi
          echo "Disposable real Navidrome authenticated search and Range: PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-navidrome-transport-result
          path: ${{ runner.temp }}/navidrome-transport-check.json
          if-no-files-found: warn
