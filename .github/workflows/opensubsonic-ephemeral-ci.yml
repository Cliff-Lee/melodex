name: OpenSubsonic disposable real-server qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/opensubsonic-ephemeral-ci.yml
      - desktop/bundled_provider_sources/opensubsonic_personal/**
      - desktop/tools/qualify_opensubsonic_live.py
      - desktop/tools/qualify_opensubsonic_inflight.py
      - desktop/melodex/playback_gateway.py
permissions:
  contents: read
jobs:
  disposable-navidrome:
    name: Real Navidrome Qt audio, restart and injected in-flight recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and audio fixture dependencies
        run: |
          python -m pip install numpy mutagen requests PySide6 "segno>=1.6,<2" keyring
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg pulseaudio pulseaudio-utils libegl1 libgl1 \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xinput0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0
      - name: Run private disposable Navidrome and Melodex provider probe
        shell: bash
        env:
          MELODEX_SUBSONIC_ALLOW_HTTP: '1'
          MELODEX_SUBSONIC_URL: http://127.0.0.1:4533
          MELODEX_SUBSONIC_USERNAME: admin
          MELODEX_SUBSONIC_QUERY: R1SyntheticSignal
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/r1-opensubsonic-fixture"
          mkdir -p "$fixture_root/music" "$fixture_root/data"
          ffmpeg -hide_banner -loglevel error -f lavfi -i \
            sine=frequency=440:duration=20 -ar 44100 -ac 2 \
            -metadata artist=MelodexCI \
            -metadata album=DisposableFixture \
            -metadata title=R1SyntheticSignal \
            -codec:a libmp3lame -q:a 4 -y \
            "$fixture_root/music/R1SyntheticSignal.mp3"

          # Short-lived randomly generated credential, never printed.
          ND_DEVAUTOCREATEADMINPASSWORD=$(python -c 'import secrets; print(secrets.token_hex(14))')
          export ND_DEVAUTOCREATEADMINPASSWORD
          export MELODEX_SUBSONIC_PASSWORD=${ND_DEVAUTOCREATEADMINPASSWORD}
          service_name="melodex-r1-nav-$$"
          cleanup() { docker rm -f "$service_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm -d --name "$service_name" \
            --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:4533:4533 \
            -v "$fixture_root/data:/data" \
            -v "$fixture_root/music:/music:ro" \
            -e ND_DEVAUTOCREATEADMINPASSWORD \
            -e ND_LOGLEVEL=warn \
            -e ND_SCANSCHEDULE="@every 1m" \
            navidrome/navidrome:0.64.2 >/dev/null

          # Wait for admin creation and index of the artificial track.
          # Printed probe output contains booleans, not song data or tokens.
          success=0
          for attempt in $(seq 1 50); do
            if PYTHONPATH=desktop python desktop/tools/qualify_opensubsonic_live.py \
              > "$RUNNER_TEMP/navidrome-transport-check.json"; then
              success=1
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/navidrome-transport-check.json"
          if [[ "$success" != 1 ]]; then
            echo "Real Navidrome transport qualification failed; no secrets logged"
            exit 1
          fi
          echo "Disposable real Navidrome authenticated search and Range: PASS"
          echo "Starting disposable PulseAudio virtual output for real Qt playback"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/melodex-pulse-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --daemonize=yes --exit-idle-time=-1
          pactl info >/dev/null
          pactl load-module module-null-sink sink_name=melodex_r1 \
            rate=44100 channels=2 >/dev/null
          pactl set-default-sink melodex_r1
          export PULSE_SINK=melodex_r1
          parec --device=melodex_r1.monitor --raw \
            --format=s16le --rate=44100 --channels=2 \
            > "$RUNNER_TEMP/r1-audio.pcm" 2>"$RUNNER_TEMP/parec.log" &
          capture_pid=$!
          sleep 1
          audio_status=0
          PYTHONPATH=desktop QT_QPA_PLATFORM=offscreen QT_MEDIA_BACKEND=ffmpeg \
            python desktop/tools/qualify_opensubsonic_qt_audio.py \
            > "$RUNNER_TEMP/qt-audio-check.json" \
            2> "$RUNNER_TEMP/qt-audio-stderr.log" || audio_status=1
          kill "$capture_pid" >/dev/null 2>&1 || true
          wait "$capture_pid" >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/qt-audio-check.json"
          pcm_status=0
          python desktop/tools/qualify_pcm_signal.py \
            "$RUNNER_TEMP/r1-audio.pcm" \
            --output "$RUNNER_TEMP/pcm-check.json" || pcm_status=1
          if [[ "$audio_status" != 0 || "$pcm_status" != 0 ]]; then
            echo "Qt audio device or PCM output gate FAILED"
            exit 1
          fi
          echo "Qt FlowPlayer decoded non-silent audio through PulseAudio virtual sink: PASS"

          # This is post-restart reconnection, NOT seamless mid-stream recovery.
          docker restart --time 1 "$service_name" >/dev/null
          reconnected=0
          for attempt in $(seq 1 50); do
            if PYTHONPATH=desktop python desktop/tools/qualify_opensubsonic_live.py \
              > "$RUNNER_TEMP/post-restart-transport.json"; then
              reconnected=1
              break
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/post-restart-transport.json"
          if [[ "$reconnected" != 1 ]]; then
            echo "Provider could not reconnect after disposable server restart"
            exit 1
          fi

          parec --device=melodex_r1.monitor --raw \
            --format=s16le --rate=44100 --channels=2 \
            > "$RUNNER_TEMP/post-restart-audio.pcm" \
            2>"$RUNNER_TEMP/post-restart-parec.log" &
          capture_pid=$!
          sleep 1
          replay_status=0
          PYTHONPATH=desktop QT_QPA_PLATFORM=offscreen QT_MEDIA_BACKEND=ffmpeg \
            python desktop/tools/qualify_opensubsonic_qt_audio.py \
            > "$RUNNER_TEMP/post-restart-qt-audio.json" \
            2> "$RUNNER_TEMP/post-restart-qt-stderr.log" || replay_status=1
          kill "$capture_pid" >/dev/null 2>&1 || true
          wait "$capture_pid" >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/post-restart-qt-audio.json"
          replay_pcm_status=0
          python desktop/tools/qualify_pcm_signal.py \
            "$RUNNER_TEMP/post-restart-audio.pcm" \
            --output "$RUNNER_TEMP/post-restart-pcm.json" || replay_pcm_status=1
          if [[ "$replay_status" != 0 || "$replay_pcm_status" != 0 ]]; then
            echo "Post-restart authenticated Qt playback or PCM gate FAILED"
            exit 1
          fi
          echo "Post-restart Navidrome reauthentication and fresh Qt PCM playback: PASS"

          # Test *existing* production FlowPlayer scheduler/resume behaviour
          # with a deliberately injected active-deck NetworkError while the
          # disposable real Navidrome server is briefly paused.
          # Natural Qt outage detection remains a distinct untested gate.
          export MELODEX_SUBSONIC_CONTAINER="$service_name"
          parec --device=melodex_r1.monitor --raw \
            --format=s16le --rate=44100 --channels=2 \
            > "$RUNNER_TEMP/inflight-recovery-audio.pcm" \
            2>"$RUNNER_TEMP/inflight-recovery-parec.log" &
          capture_pid=$!
          sleep 1
          inflight_status=0
          PYTHONPATH=desktop QT_QPA_PLATFORM=offscreen QT_MEDIA_BACKEND=ffmpeg \
            python desktop/tools/qualify_opensubsonic_inflight.py \
            > "$RUNNER_TEMP/inflight-recovery.json" \
            2> "$RUNNER_TEMP/inflight-qt-stderr.log" || inflight_status=1
          kill "$capture_pid" >/dev/null 2>&1 || true
          wait "$capture_pid" >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/inflight-recovery.json"
          inflight_pcm_status=0
          python desktop/tools/qualify_pcm_signal.py \
            "$RUNNER_TEMP/inflight-recovery-audio.pcm" \
            --output "$RUNNER_TEMP/inflight-pcm.json" || inflight_pcm_status=1
          if [[ "$inflight_status" != 0 || "$inflight_pcm_status" != 0 ]]; then
            echo "Controlled mid-playback recovery or decoded PCM qualification failed"
            exit 1
          fi
          echo "Existing FlowPlayer recovery with injected NetworkError: PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-navidrome-transport-result
          path: |
            ${{ runner.temp }}/navidrome-transport-check.json
            ${{ runner.temp }}/qt-audio-check.json
            ${{ runner.temp }}/pcm-check.json
            ${{ runner.temp }}/post-restart-transport.json
            ${{ runner.temp }}/post-restart-qt-audio.json
            ${{ runner.temp }}/post-restart-pcm.json
            ${{ runner.temp }}/inflight-recovery.json
            ${{ runner.temp }}/inflight-pcm.json
          if-no-files-found: warn
