name: Live bundled provider smoke

on:
  workflow_dispatch:
  push:
    branches:
      - campaign/live-provider-verification-2026-10-01
    paths:
      - "scripts/live_bundled_provider_smoke.py"
      - ".github/workflows/live-bundled-providers.yml"
      - "desktop/melodex/**"

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop runtime dependencies
        run: pip install numpy mutagen requests PySide6
      - name: Inspect bundled LibriVox network path
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          package = Path("desktop/melodex/bundled_providers/LibriVox-0.1.2.mdxprovider")
          with zipfile.ZipFile(package) as zf:
              lines = zf.read("provider.py").decode("utf-8").splitlines()
          needles = ("API =", "def _fetch", "def _pace", "def _search", "provider.health")
          wanted = set()
          for i, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  wanted.update(range(max(0, i - 3), min(len(lines), i + 28)))
          for i in sorted(wanted):
              print(f"{i+1:04d}: {lines[i]}")
          PY
      - name: Run live bundled-provider smoke test
        env:
          PYTHONPATH: desktop
        run: python scripts/live_bundled_provider_smoke.py --json live-provider-report.json
      - name: Upload live provider report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-report
          path: live-provider-report.json
          if-no-files-found: warn
