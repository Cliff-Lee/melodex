name: Live bundled provider smoke

on:
  workflow_dispatch:
  push:
    branches:
      - campaign/live-provider-verification-2026-10-01
    paths:
      - "scripts/live_bundled_provider_smoke.py"
      - ".github/workflows/live-bundled-providers.yml"
      - "desktop/melodex/**"

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop runtime dependencies
        run: pip install numpy mutagen requests PySide6
      - name: Measure LibriVox lightweight API path
        run: |
          python - <<'PY'
          import json, time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def get(label, base, params):
              start=time.monotonic()
              req=Request(
                  base+"?"+urlencode(params, doseq=True),
                  headers={
                      "User-Agent":"Melodex-LiveProvider-Diagnostic/0.2",
                      "Accept":"application/json",
                      "Connection":"close",
                  },
              )
              try:
                  with urlopen(req, timeout=45) as response:
                      payload=response.read()
                  print(f"LIBRIVOX {label} PASS {time.monotonic()-start:.2f}s {len(payload)} bytes")
                  return json.loads(payload.decode("utf-8","replace"))
              except Exception as exc:
                  print(f"LIBRIVOX {label} FAIL {time.monotonic()-start:.2f}s {exc}")
                  return None

          books=get(
              "fields-search",
              "https://librivox.org/api/feed/audiobooks/",
              {
                  "title":"Odyssey",
                  "format":"json",
                  "limit":"1",
                  "offset":"0",
                  "fields[]":["id","title","authors","url_librivox","coverart_thumbnail"],
              },
          )
          rows=(books or {}).get("books") or []
          if rows:
              book_id=str(rows[0].get("id") or "")
              print("LIBRIVOX book_id", book_id, "title", rows[0].get("title"))
              time.sleep(4)
              tracks=get(
                  "audiotracks",
                  "https://librivox.org/api/feed/audiotracks/",
                  {"project_id":book_id,"format":"json"},
              )
              if tracks is not None:
                  print("LIBRIVOX tracks-shape", type(tracks).__name__, str(tracks)[:500])
          PY
      - name: Run live bundled-provider smoke test
        env:
          PYTHONPATH: desktop
        run: python scripts/live_bundled_provider_smoke.py --json live-provider-report.json
      - name: Upload live provider report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-report
          path: live-provider-report.json
          if-no-files-found: warn
