name: Elastic Library Release Qualification

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Comma-separated track counts"
        required: false
        default: "100000,250000,500000,1000000"
      stat_delay_ms:
        description: "Artificial stat latency in milliseconds"
        required: false
        default: "0"
      directory_delay_ms:
        description: "Artificial directory latency in milliseconds"
        required: false
        default: "0"

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner qualification dependencies
        run: python -m pip install mutagen
      - name: Run P10i release-scale qualification
        env:
          PYTHONPATH: desktop
        run: |
          python desktop/tools/qualify_large_library.py \
            --profiles "${{ inputs.profiles }}" \
            --stat-delay-ms "${{ inputs.stat_delay_ms }}" \
            --directory-delay-ms "${{ inputs.directory_delay_ms }}" \
            --json > p10i-release-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10i-release-qualification
          path: p10i-release-qualification.json
