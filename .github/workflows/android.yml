name: Build Android
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the built assets
        required: false
        type: string
      release_sha:
        description: Optional exact commit SHA to build for a release
        required: false
        type: string
  pull_request:
    paths:
      - 'android/**'
      - 'VERSION'
      - 'scripts/version_check.py'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/version_check.py --release-tag "$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/version_check.py --release-tag "$GITHUB_REF_NAME"
          else
            python scripts/version_check.py
          fi
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Play upload signing
        id: play_signing
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.MELODEX_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.MELODEX_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.MELODEX_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.MELODEX_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$UPLOAD_KEYSTORE_BASE64" && -z "$UPLOAD_STORE_PASSWORD" && -z "$UPLOAD_KEY_ALIAS" && -z "$UPLOAD_KEY_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "The Play upload bundle will be unsigned because signing secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure all four MELODEX_UPLOAD_* repository secrets before a signed Play upload build."
              exit 1
            fi
          done
          key_file="$RUNNER_TEMP/melodex-play-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          {
            echo "MELODEX_UPLOAD_STORE_FILE=$key_file"
            echo "MELODEX_UPLOAD_STORE_PASSWORD=$UPLOAD_STORE_PASSWORD"
            echo "MELODEX_UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS"
            echo "MELODEX_UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build directly installable APK and Play Store bundle
        working-directory: android
        env:
          PLAY_UPLOAD_SIGNING_ENABLED: ${{ steps.play_signing.outputs.enabled }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:bundleRelease
          bundle_path="app/build/outputs/bundle/release/app-release.aab"
          if [[ "${PLAY_UPLOAD_SIGNING_ENABLED:-false}" == "true" ]]; then
            jarsigner -verify "$bundle_path"
            echo "The Android App Bundle is signed with the configured Play upload key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The Android App Bundle is unsigned and cannot be uploaded to Play Console." >> "$GITHUB_STEP_SUMMARY"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Melodex-Android.apk
          cp "$bundle_path" Melodex-Android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Melodex-Android
          path: |
            android/Melodex-Android.apk
            android/Melodex-Android.aab
      - name: Attach Android assets to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.')) || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            android/Melodex-Android.apk
            android/Melodex-Android.aab
