name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build directly installable APK and Play Store bundle
        working-directory: android
        run: |
          gradle :app:assembleDebug :app:bundleRelease
          cp app/build/outputs/apk/debug/app-debug.apk Melodex-Android.apk
          cp app/build/outputs/bundle/release/app-release.aab Melodex-Android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Melodex-Android
          path: |
            android/Melodex-Android.apk
            android/Melodex-Android.aab
      - name: Attach Android assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/Melodex-Android.apk
            android/Melodex-Android.aab
