name: Qt native shutdown backtrace
on:
  workflow_dispatch:
jobs:
  native-qt-backtrace:
    name: Qt SIGSEGV C++ backtrace
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gdb and Qt headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - run: python -m pip install pytest numpy mutagen requests PySide6 "segno>=1.6,<2" keyring
      - name: Capture native crash, not just passing test assertions
        run: bash scripts/qt_native_backtrace.sh qt-native-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-native-backtrace
          path: qt-native-evidence/
          if-no-files-found: warn
