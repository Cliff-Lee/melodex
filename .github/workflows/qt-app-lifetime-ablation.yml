name: Qt QApplication lifetime ablation
on:
  workflow_dispatch:
jobs:
  qt-app-ablation:
    name: QApplication lifetime ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, pinned]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - run: python -m pip install pytest numpy mutagen requests PySide6 "segno>=1.6,<2" keyring
      - name: Repeat smallest observed crashing combination
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: desktop
          PYTHONFAULTHANDLER: '1'
          PIN_APP: ${{ matrix.variant == 'pinned' && '--pin-app' || '' }}
        run: |
          python scripts/qt_lifetime_isolation.py \
            --mode triple --repeats 40 \
            --json-out "qt-app-${{ matrix.variant }}.json" \
            $PIN_APP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-app-ablation-${{ matrix.variant }}
          path: qt-app-${{ matrix.variant }}.json
          if-no-files-found: error
      - name: Enforce zero native crashes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          variant = "${{ matrix.variant }}"
          path = Path(f"qt-app-{variant}.json")
          result = json.loads(path.read_text("utf-8"))
          failures = result["failures"]
          print(f"{variant}: {result['runs'] - failures}/{result['runs']} clean exits")
          if failures:
              raise SystemExit("Native Qt process exits failed; artifact preserves evidence.")
          PY
