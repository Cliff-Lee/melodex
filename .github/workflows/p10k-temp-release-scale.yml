name: P10k Release Scale Qualification

on:
  push:
    branches:
      - codex/p10k-release-scale-qualification-2026-10-03

jobs:
  qualify:
    name: Qualify ${{ matrix.tracks }} tracks
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tracks: [250000, 500000, 1000000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner qualification dependencies
        run: python -m pip install mutagen
      - name: Run scale qualification
        env:
          PYTHONPATH: desktop
        run: |
          python desktop/tools/qualify_large_library.py \
            --profiles "${{ matrix.tracks }}" \
            --json > "p10k-qualification-${{ matrix.tracks }}.json"
      - name: Measure cold RSS without tracemalloc
        env:
          PYTHONPATH: desktop
        run: |
          python desktop/tools/profile_scan_rss.py \
            --tracks "${{ matrix.tracks }}" \
            --json > "p10k-rss-${{ matrix.tracks }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10k-scale-${{ matrix.tracks }}
          path: |
            p10k-qualification-${{ matrix.tracks }}.json
            p10k-rss-${{ matrix.tracks }}.json
