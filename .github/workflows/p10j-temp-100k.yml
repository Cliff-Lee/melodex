name: P10j Temporary 100k Comparison

on:
  push:
    branches:
      - codex/p10j-traversal-gates-2026-10-03

jobs:
  compare-100k:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install mutagen
      - name: Run scandir 100k qualification
        env:
          PYTHONPATH: desktop
        run: |
          python desktop/tools/qualify_large_library.py \
            --profiles 100000 \
            --json > p10j-qualification-100k.json
      - name: Run 100k RSS probe without tracemalloc
        env:
          PYTHONPATH: desktop
        run: |
          python desktop/tools/profile_scan_rss.py \
            --tracks 100000 \
            --json > p10j-rss-100k.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10j-100k-comparison
          path: |
            p10j-qualification-100k.json
            p10j-rss-100k.json
