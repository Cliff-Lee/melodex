name: Qt deterministic teardown ablation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/qt_lifetime_cleanup_probe.py
      - desktop/melodex/main_window.py
      - desktop/tests/test_main_window_close_idempotent.py
      - .github/workflows/qt-cleanup-ablation.yml
jobs:
  deterministic-cleanup:
    name: Qt explicit teardown before PySide atexit
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - run: python -m pip install pytest numpy mutagen requests PySide6 "segno>=1.6,<2" keyring
      - name: Measure strict clean exits with explicit Qt teardown
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: desktop:scripts
          PYTHONFAULTHANDLER: '1'
          PYTEST_ADDOPTS: -p qt_lifetime_cleanup_probe
        run: |
          python scripts/qt_lifetime_isolation.py \
            --mode triple --repeats 40 \
            --json-out qt-cleanup-ablation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-cleanup-ablation
          path: qt-cleanup-ablation.json
          if-no-files-found: error
      - name: Enforce strict zero-crash outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("qt-cleanup-ablation.json").read_text("utf-8"))
          print(f"Qt explicit teardown: {r['runs']-r['failures']}/{r['runs']} clean interpreter exits")
          if r["failures"]:
              raise SystemExit("Qt destructor failure persists; test-only cleanup hypothesis rejected.")
          PY
