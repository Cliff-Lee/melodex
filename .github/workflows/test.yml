name: Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest numpy mutagen requests PySide6
      - run: python -m compileall -q desktop/melodex provider-sdk/examples/ecosystem
      - name: Desktop tests
        env:
          PYTHONPATH: desktop
          QT_QPA_PLATFORM: offscreen
        run: pytest -q desktop/tests
      - run: python scripts/docs_check.py
      - run: python scripts/navigation_check.py
      - run: python scripts/terminology_check.py
      - run: python scripts/ecosystem_check.py
      - run: python scripts/version_check.py
      - run: python scripts/release_check.py
      - run: python scripts/release_readiness.py
      - name: Provider SDK tests
        run: |
          pip install -e provider-sdk
          pytest -q provider-sdk/tests
          melodex-registry validate provider-sdk/registry/registry.json
          melodex-registry verify-packages provider-sdk/registry/registry.json --packages provider-sdk/registry/packages
          melodex-registry validate-reviews provider-sdk/registry/registry.json --reviews provider-sdk/registry/reviews


  fluid-responsiveness:
    name: Fluid Melodex release gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime for responsiveness scenarios
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libdbus-1-3 libegl1 libfontconfig1 libfreetype6 \
            libgl1 libglib2.0-0 libpulse0 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxext6 libxrender1
      - name: Install Fluid Melodex test dependencies
        run: python -m pip install pytest numpy mutagen requests PySide6 keyring
      - name: Run Fluid Melodex release gates
        env:
          PYTHONPATH: desktop
          QT_QPA_PLATFORM: offscreen
        run: python scripts/fluid_ci_gate.py
