name: P10i Temporary 100k Probe

on:
  push:
    branches:
      - codex/p10i-million-scale-qualification-2026-10-03

jobs:
  qualify-100k:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install mutagen
      - name: Run 100k qualification
        env:
          PYTHONPATH: desktop
        run: |
          python desktop/tools/qualify_large_library.py \
            --profiles 100000 \
            --json > p10i-qualification-100k.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p10i-qualification-100k
          path: p10i-qualification-100k.json
