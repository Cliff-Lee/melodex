name: Build desktop
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive the built assets
        required: false
        type: string
      release_sha:
        description: Optional exact commit SHA to build for a release
        required: false
        type: string
  pull_request:
    paths:
      - 'desktop/**'
      - 'provider-sdk/**'
      - 'VERSION'
      - 'scripts/version_check.py'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-intel
          - os: windows-latest
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify app version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python scripts/version_check.py --release-tag "$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/version_check.py --release-tag "$GITHUB_REF_NAME"
          else
            python scripts/version_check.py
          fi
      - name: Build macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd desktop
          chmod +x build_macos.sh
          ./build_macos.sh
          if [ -f dist/Melodex-qt-audit.md ]; then cat dist/Melodex-qt-audit.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f dist/Melodex-bundle-size.md ]; then cat dist/Melodex-bundle-size.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f dist/Melodex.dmg ]; then mv dist/Melodex.dmg dist/Melodex-${{ matrix.name }}.dmg; fi
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd desktop
          .\build_windows.ps1
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Melodex-${{ matrix.name }}
          path: |
            desktop/dist/Melodex-${{ matrix.name }}.dmg
            desktop/dist/Melodex-bundle-size.json
            desktop/dist/Melodex-bundle-size.md
            desktop/dist/Melodex-qt-audit.json
            desktop/dist/Melodex-qt-audit.md
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Melodex-${{ matrix.name }}
          path: |
            desktop/dist/Melodex-Windows-portable.zip
            desktop/dist/Melodex-Windows-x64-Setup.exe
      - name: Attach desktop assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            desktop/dist/Melodex-${{ matrix.name }}.dmg
            desktop/dist/Melodex-Windows-portable.zip
            desktop/dist/Melodex-Windows-x64-Setup.exe
          fail_on_unmatched_files: false
