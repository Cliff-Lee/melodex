name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write


jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/docs_check.py
      - run: python scripts/ecosystem_check.py
      - run: python scripts/api_docs_check.py
      - run: python scripts/release_version_check.py "${{ github.ref_name }}"
      - run: python scripts/release_check.py
      - run: |
          zip -r Melodex-${GITHUB_REF_NAME}-source.zip . -x '.git/*' '*/build/*' '*/dist/*' '*.pyc' '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: Melodex-${{ github.ref_name }}-source.zip
          generate_release_notes: true
