name: Release
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  orchestrate-main-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION=$VERSION_VALUE is a development version; no release will be created."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v$VERSION_VALUE"
          REMOTE_TAG_SHA="$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$REMOTE_TAG_SHA" && "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG already points to $REMOTE_TAG_SHA, not this release commit $GITHUB_SHA."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install release-test dependencies
        if: steps.release.outputs.publish == 'true'
        run: |
          python -m pip install pytest numpy mutagen requests
          python -m pip install -e provider-sdk

      - name: Verify release version
        if: steps.release.outputs.publish == 'true'
        run: python scripts/version_check.py --release-tag "${{ steps.release.outputs.tag }}"

      - name: Run repository checks
        if: steps.release.outputs.publish == 'true'
        run: |
          python scripts/docs_check.py
          python scripts/navigation_check.py
          python scripts/terminology_check.py
          python scripts/ecosystem_check.py
          python scripts/release_check.py

      - name: Run release test suites
        if: steps.release.outputs.publish == 'true'
        run: |
          PYTHONPATH=desktop pytest -q desktop/tests
          pytest -q provider-sdk/tests
          melodex-registry validate provider-sdk/registry/registry.json
          melodex-registry verify-packages provider-sdk/registry/registry.json --packages provider-sdk/registry/packages
          melodex-registry validate-reviews provider-sdk/registry/registry.json --reviews provider-sdk/registry/reviews

      - name: Build source archive
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          zip -r "Melodex-${{ steps.release.outputs.tag }}-source.zip" . \
            -x '.git/*' '*/build/*' '*/dist/*' '*.pyc' '*/__pycache__/*'

      - name: Create or verify GitHub Release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/$TAG.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists for this commit; reusing it."
          elif [[ -f "$NOTES_FILE" ]]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

          gh release upload "$TAG" \
            "Melodex-$TAG-source.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Dispatch release distribution builds
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run desktop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$TAG" \
            -f release_sha="$GITHUB_SHA"

          gh workflow run android.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$TAG" \
            -f release_sha="$GITHUB_SHA"

  source-from-manual-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/docs_check.py
      - run: python scripts/navigation_check.py
      - run: python scripts/terminology_check.py
      - run: python scripts/ecosystem_check.py
      - run: python scripts/version_check.py --release-tag "${GITHUB_REF_NAME}"
      - run: python scripts/release_check.py
      - run: |
          zip -r "Melodex-${GITHUB_REF_NAME}-source.zip" . -x '.git/*' '*/build/*' '*/dist/*' '*.pyc' '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: Melodex-${{ github.ref_name }}-source.zip
          generate_release_notes: true
